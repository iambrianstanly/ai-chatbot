services:
  backend:
    build:
      context: .
      target: backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-ai-chatbot-key-2026-may}
      SQLITE_PATH: /data/chatbot.db
    volumes:
      - sqlite-data:/data

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  sqlite-data:
