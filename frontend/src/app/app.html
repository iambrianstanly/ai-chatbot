<div class="app-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <button class="new-chat-btn" (click)="createNewSession()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      <span>New Chat</span>
    </button>

    <div class="sidebar-content">
      <div class="history-label">Recent</div>
      <div class="history-list">
        <div class="history-item" 
             *ngFor="let session of recentSessions"
             [class.active]="currentSession?.session_id === session.session_id"
             (click)="selectSession(session)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
          </svg>
          <span>{{ session.title }}</span>
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="avatar">B</div>
        <span>Brian</span>
      </div>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="chat-main">
    <header class="chat-header">
      <div class="model-info">
        <div class="header-bot-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7H3a7 7 0 0 1 7-7h1V5.73A2 2 0 0 1 12 2M5 14v8h14v-8H5m2 2h2v2H7v-2m4 0h2v2h-2v-2m4 0h2v2h-2v-2Z"/>
          </svg>
        </div>
        <div class="model-text">
          <span class="model-name">ChatGPT</span>
          <span class="model-sub">Powered by Llama-3.3 on Groq</span>
        </div>
        <span class="status-badge">Online</span>
      </div>
      <button class="clear-btn" (click)="clearChat()" title="Clear chat" [disabled]="messages.length === 0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
        </svg>
      </button>
    </header>

    <div class="message-container-wrapper">
      <app-chat-window
        [messages]="messages"
        [isLoading]="isLoading"
      ></app-chat-window>
    </div>

    <div class="input-container-wrapper">
      <div class="error-banner" *ngIf="errorMessage">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/>
        </svg>
        {{ errorMessage }}
      </div>

      <div class="input-box">
        <textarea
          id="chat-input"
          [(ngModel)]="userInput"
          (keydown)="onKeyDown($event)"
          placeholder="Describe your product (e.g. 'a solar-powered coffee maker')..."
          rows="1"
          [disabled]="isLoading"
          autocomplete="off"
        ></textarea>
        <button
          id="send-btn"
          class="send-btn"
          (click)="sendMessage()"
          [disabled]="!userInput.trim() || isLoading"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" />
          </svg>
        </button>
      </div>
      <p class="disclaimer">AI can make mistakes. Check important info.</p>
    </div>
  </main>
</div>
