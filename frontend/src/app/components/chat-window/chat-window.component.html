<div class="chat-window">
  <div
    class="messages-container"
    #messagesContainer
    (scroll)="onScroll($event)"
  >
    <!-- Empty state -->
    <div class="empty-state" *ngIf="messages.length === 0 && !isLoading">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 0 1-2.555-.337A5.972 5.972 0 0 1 5.41 20.97a5.969 5.969 0 0 1-.474-.065 4.48 4.48 0 0 0 .978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25Z" />
        </svg>
      </div>
      <h3>Generate Brand Names</h3>
      <p>Describe your product or service, and our AI will recommend a unique, memorable brand name!</p>
    </div>

    <!-- Messages -->
    <app-message-bubble
      *ngFor="let msg of messages; trackBy: trackByIndex"
      [message]="msg"
    ></app-message-bubble>

    <!-- Typing indicator -->
    <div class="typing-indicator" *ngIf="isLoading">
      <div class="avatar bot-avatar">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7H3a7 7 0 0 1 7-7h1V5.73A2 2 0 0 1 12 2M5 14v8h14v-8H5m2 2h2v2H7v-2m4 0h2v2h-2v-2m4 0h2v2h-2v-2Z"/>
        </svg>
      </div>
      <div class="bubble">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <div #scrollAnchor></div>
  </div>

  <!-- Scroll to Top button -->
  <button
    class="scroll-top-btn"
    *ngIf="showScrollTop"
    (click)="scrollToTop()"
    title="Scroll to first prompt"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
    </svg>
    <span>First Prompt</span>
  </button>
</div>
